<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#020916"><title>E.V.I.E. Mark II — Mobile</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% 42%,#082747 0%,#030d1e 40%,#01040a 80%);color:#e9f8ff;overflow:hidden}
.shell{height:100dvh;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 25px) 20px calc(env(safe-area-inset-bottom) + 22px);justify-content:space-between}
header{text-align:center}header h1{font-size:18px;letter-spacing:.5em;margin:0 0 9px 8px;font-weight:550;text-shadow:0 0 16px #39c9ff}header p{font-size:10px;letter-spacing:.29em;color:#7ab7d1;margin:0}
.hud{position:relative;width:min(91vw,420px);aspect-ratio:1;display:grid;place-items:center;filter:drop-shadow(0 0 16px #0077c588)}
.ring{position:absolute;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 0 15px #0088dd33,0 0 18px #00aaff44}
.r1{inset:5%;border-top-color:#5ce6ff;border-bottom-color:#24baff;animation:spin 12s linear infinite}
.r2{inset:13%;border-left:3px dashed #2fc9ff;border-right:3px dashed #2fc9ff;animation:spin 18s linear infinite reverse}
.r3{inset:22%;border:1px solid #35bfff88;border-top:4px solid #a0f1ff;animation:spin 8s linear infinite}
.r4{inset:30%;border:2px dotted #37c6ff;animation:spin 16s linear infinite reverse}
.arc{position:absolute;inset:1%;border-radius:50%;background:repeating-conic-gradient(from 12deg,#38c8ff 0 1.5deg,transparent 1.5deg 14deg);mask:radial-gradient(transparent 68%,#000 69% 71%,transparent 72%);opacity:.65;animation:spin 35s linear infinite}
.core{width:31%;aspect-ratio:1;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle,#0c4773 0%,#06213d 55%,#010c19 75%);border:1px solid #5ce6ff;box-shadow:0 0 35px #00baff77,inset 0 0 26px #2dd7ff55;text-align:center}
.core strong{font-size:clamp(15px,4.5vw,22px);letter-spacing:.12em}.core small{font-size:8px;color:#86dfff;letter-spacing:.15em;margin-top:7px}
.hud.active .core{animation:pulse 1.1s ease-in-out infinite alternate}.hud.active .r3{animation-duration:3s}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{to{box-shadow:0 0 60px #2ed7ff,inset 0 0 40px #6ae9ff}}
.bottom{width:min(100%,440px);text-align:center}.status{font-size:12px;letter-spacing:.16em;color:#9acde1;min-height:42px;line-height:1.6}
button{background:#071f35;border:1px solid #43caff;border-radius:100px;color:#d7f7ff;padding:14px 20px;font-weight:600;letter-spacing:.06em;box-shadow:0 0 15px #008ee955;cursor:pointer}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.secondary{border-color:#32617e;background:#06111e;font-size:12px}
.note{font-size:11px;color:#6990a8;line-height:1.5;margin:18px auto 0;max-width:320px}
@media(max-height:650px){.hud{width:min(65vh,75vw)}.shell{padding-top:12px;padding-bottom:12px}.note{margin-top:8px}}
</style></head>
<body><main class="shell"><header><h1>E.V.I.E.</h1><p>MARK II • MOBILE INTERFACE</p></header>
<div class="hud" id="hud"><div class="arc"></div><div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div><div class="ring r4"></div><div class="core"><strong>E.V.I.E.</strong><small>ONLINE • DEMO</small></div></div>
<div class="bottom"><div class="status" id="status" aria-live="polite">Mobile interface ready.<br>Tap “Activate E.V.I.E.”</div>
<div style="margin:0 auto 12px;max-width:310px"><label for="voice" style="display:block;font-size:11px;color:#9acde1;margin-bottom:6px">VOICE SELECTION</label><select id="voice" style="width:100%;background:#071f35;color:#e9f8ff;border:1px solid #43caff;border-radius:9px;padding:9px"><option value="">Default British voice</option></select></div><div class="actions"><button id="activate">Activate E.V.I.E.</button><button class="secondary" id="test">Play Voice Sample</button></div>
<p class="note">Voice audition prototype. The voice options depend on your iPhone. Real AI conversation and always-on wake word are not connected yet.</p></div></main>
<script>
const hud=document.getElementById('hud'),status=document.getElementById('status');
let availableVoices=[];const voiceSelect=document.getElementById("voice");function refreshVoices(){availableVoices=speechSynthesis.getVoices();const previous=voiceSelect.value;voiceSelect.innerHTML="";const fallback=document.createElement("option");fallback.value="";fallback.textContent="Default British voice";voiceSelect.appendChild(fallback);availableVoices.forEach((v,i)=>{const o=document.createElement("option");o.value=String(i);o.textContent=v.name+" ("+v.lang+")";voiceSelect.appendChild(o)});if([...voiceSelect.options].some(o=>o.value===previous))voiceSelect.value=previous;}if("speechSynthesis" in window){refreshVoices();speechSynthesis.onvoiceschanged=refreshVoices;}function say(s){if(!('speechSynthesis' in window)){status.textContent='Speech output unavailable in this browser.';return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s);u.lang='en-GB';u.rate=0.96;if(voiceSelect.value!=='' && availableVoices[Number(voiceSelect.value)])u.voice=availableVoices[Number(voiceSelect.value)];u.onstart=()=>hud.classList.add('active');u.onend=()=>hud.classList.remove('active');speechSynthesis.speak(u)}
document.getElementById('test').onclick=()=>{status.textContent='E.V.I.E. voice audition playing…';say('Good evening, sir. E.V.I.E. Mark Two, at your service. I am pleased to report that the interface is looking rather impressive. The conversational intelligence is still under construction, but I assure you, we are making progress. And before you ask, no, I cannot make your coffee. Yet. Now then, shall we get to work?')};
document.getElementById('activate').onclick=()=>{
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){status.textContent='This browser does not support speech recognition here. The visual dashboard still works.';return}
const r=new SR();r.lang='en-US';r.interimResults=false;r.continuous=false;
r.onstart=()=>{hud.classList.add('active');status.textContent='Listening… say “Hey Evie”'};
r.onresult=e=>{const words=e.results[0][0].transcript.toLowerCase();hud.classList.remove('active');if(/hey\s*(evie|e\.v\.i\.e|evee)/.test(words)){status.textContent='Wake phrase recognized';say('Yes, sir?')}else{status.textContent='Heard: '+words+' — try “Hey Evie”'}};
r.onerror=e=>{hud.classList.remove('active');status.textContent='Microphone recognition unavailable: '+e.error};
r.onend=()=>hud.classList.remove('active');
try{r.start()}catch(e){status.textContent='Could not start microphone: '+e.message}
};
</script></body></html>
